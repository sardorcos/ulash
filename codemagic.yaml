# Codemagic CI/CD for Ulash. Setup steps: docs/RELEASE.md.
#
# Before the first run (once, in the Codemagic UI):
#   1. Teams → Integrations → Developer Portal → add an App Store Connect API
#      key (role "App Manager") and name it exactly "Ulash App Store Connect"
#      (or change `integrations.app_store_connect` below).
#   2. App → Environment variables → group "ios_signing_key" with the secret
#      CERTIFICATE_PRIVATE_KEY (an RSA private key in PEM format; see
#      docs/RELEASE.md). Reusing one key prevents a new distribution
#      certificate from being created on every build.
#   3. Replace APP_STORE_APPLE_ID with the numeric "Apple ID" of the app
#      (App Store Connect → App Information).
#
# Both workflows start manually (no `triggering` section).

definitions:
  flutter_version: &flutter_version
    # Pinned to the version in the lockfiles. If Codemagic does not list this
    # version yet, use `stable` temporarily and re-run the analyzer and tests.
    flutter: 3.50.1
  core_tests: &core_tests
    name: Core — analyze and test
    script: |
      set -euo pipefail
      cd "$CM_BUILD_DIR/packages/transfer_core"
      dart pub get --enforce-lockfile
      dart analyze --fatal-infos
      dart test
  app_tests: &app_tests
    name: App — analyze and test
    script: |
      set -euo pipefail
      cd "$CM_BUILD_DIR/apps/file_transfer"
      flutter --no-version-check pub get --enforce-lockfile
      flutter --no-version-check analyze --no-pub
      flutter --no-version-check test --no-pub

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 75
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      <<: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - shared_signing # CERTIFICATE_PRIVATE_KEY (secure, shared key)
      vars:
        BUNDLE_ID: uz.ulash.app
        SHARE_BUNDLE_ID: uz.ulash.app.share
        APP_GROUP: group.uz.ulash.app
        # "Share → Ulash" extension. Set to "false" to build without it. When
        # the App Group is not yet assigned in Apple Developer, the build
        # detects it from the profiles and ships without the extension.
        SHARE_EXTENSION: "true"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      # Full analysis and tests run on every push in GitHub Actions (Linux);
      # here the analyzer guards the exact commit being shipped.
      - name: Analyze
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/packages/transfer_core"
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos
          cd "$CM_BUILD_DIR/apps/file_transfer"
          flutter --no-version-check pub get --enforce-lockfile
          flutter --no-version-check analyze --no-pub
      - name: Find the App Store Connect app
        script: |
          set -euo pipefail
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")')
          if [ -z "$APP_ID" ]; then
            echo "No App Store Connect app for $BUNDLE_ID" >&2
            exit 1
          fi
          echo "App Store Connect app id: $APP_ID"
          echo "APP_STORE_APPLE_ID=$APP_ID" >> "$CM_ENV"
      # Signing: the shared Apple Distribution certificate key
      # (CERTIFICATE_PRIVATE_KEY in group shared_signing). fetch-signing-files
      # finds the certificate for that key, or creates it once, and creates
      # the App Store profile for uz.ulash.app via the integration's API key.
      # No development certificate is used.
      - name: Set up keychain
        script: keychain initialize
      - name: Share extension identifiers
        script: |
          set -uo pipefail
          if [ "$SHARE_EXTENSION" = "false" ]; then
            echo "Share extension disabled for this build."
            exit 0
          fi
          resource_id() {
            app-store-connect bundle-ids list --bundle-id-identifier "$1" --strict-match-identifier \
              --platform IOS --json | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")'
          }
          SHARE_ID=$(resource_id "$SHARE_BUNDLE_ID")
          if [ -z "$SHARE_ID" ]; then
            echo "Registering $SHARE_BUNDLE_ID"
            app-store-connect bundle-ids create "$SHARE_BUNDLE_ID" --name "Ulash Share" --platform IOS || true
            SHARE_ID=$(resource_id "$SHARE_BUNDLE_ID")
          fi
          APP_RES_ID=$(resource_id "$BUNDLE_ID")
          # Enabling is harmless when already on. Assigning the group itself is
          # only possible in Apple Developer (no API); see docs/RELEASE.md.
          for id in "$APP_RES_ID" "$SHARE_ID"; do
            [ -n "$id" ] && app-store-connect bundle-ids enable-capabilities "$id" --capability "App Groups" \
              || echo "App Groups capability unchanged for $id"
          done
      - name: Fetch App Store signing files
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          if [ "$SHARE_EXTENSION" != "false" ]; then
            app-store-connect fetch-signing-files "$SHARE_BUNDLE_ID" \
              --type IOS_APP_STORE \
              --strict-match-identifier \
              --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
              --create || echo "Could not prepare signing for $SHARE_BUNDLE_ID"
          fi
      - name: Check the App Group in the profiles
        script: |
          set -uo pipefail
          # Both profiles must carry the App Group, otherwise signing with the
          # group entitlement fails. Fall back to a build without the extension.
          has_group() {
            for profile in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
              [ -f "$profile" ] || continue
              security cms -D -i "$profile" 2>/dev/null | python3 -c '
          import plistlib, sys
          bundle, group = sys.argv[1], sys.argv[2]
          data = plistlib.loads(sys.stdin.buffer.read())
          ent = data.get("Entitlements", {})
          app = ent.get("application-identifier", "")
          ok = app.split(".", 1)[-1] == bundle and group in ent.get("com.apple.security.application-groups", [])
          sys.exit(0 if ok else 1)' "$1" "$APP_GROUP" && return 0
            done
            return 1
          }
          if [ "$SHARE_EXTENSION" != "false" ] && has_group "$BUNDLE_ID" && has_group "$SHARE_BUNDLE_ID"; then
            echo "App Group $APP_GROUP is assigned: building with the Share extension."
          else
            echo "Building without the Share extension (App Group not assigned or disabled)."
            python3 "$CM_BUILD_DIR/scripts/ios_share_extension.py" --disable "$CM_BUILD_DIR/apps/file_transfer/ios"
            echo "SHARE_EXTENSION=false" >> "$CM_ENV"
          fi
      - name: Install certificates and profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/file_transfer"
          # Marketing version comes from pubspec.yaml (version: X.Y.Z+N).
          BUILD_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          # The first upload has no builds yet; any API error is printed.
          if ! LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID"); then
            echo "No previous build number found; using a timestamp." >&2
            LATEST=0
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          # A UTC timestamp floor (yyDDDHHMM) keeps numbers increasing even if
          # the lookup failed, so an upload can never be a duplicate.
          STAMP=$(date -u +%y%j%H%M | sed 's/^0*//')
          BUILD_NUMBER=$((LATEST + 1))
          if [ "$STAMP" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER=$STAMP; fi
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          flutter --no-version-check build ipa --release --no-pub \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GIT_SHA="${CM_COMMIT:-unknown}" \
            --split-debug-info=build/symbols \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa
    artifacts:
      - apps/file_transfer/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - apps/file_transfer/build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - apps/file_transfer/build/symbols/*.symbols
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: the build appears in TestFlight for INTERNAL testers
        # after Apple finishes processing (no Beta App Review needed).
        # For external testers, fill in "Test Information" in App Store
        # Connect first, then set submit_to_testflight: true and list groups.
        submit_to_testflight: false
        # beta_groups:
        #   - External testers
        submit_to_app_store: false

  android-internal:
    name: Android → Google Play (internal)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *flutter_version
      # Upload keystore added in Codemagic → Code signing identities → Android
      # keystores. Codemagic exports CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD,
      # CM_KEY_ALIAS and CM_KEY_PASSWORD, which android/app/build.gradle.kts reads.
      android_signing:
        - ulash_upload_keystore
      groups:
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (service account JSON)
      vars:
        PACKAGE_NAME: uz.ulash.app
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - *core_tests
      - *app_tests
      - name: Check release signing
        script: |
          # Gradle also refuses an unsigned release; fail early with a clear hint.
          for v in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "Android upload keystore is not attached ($v missing)." >&2
              echo "Codemagic → Team → Code signing identities → Android keystores → 'ulash_upload_keystore'." >&2
              exit 1
            fi
          done
      - name: Build App Bundle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/file_transfer"
          BUILD_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          if ! LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME"); then
            echo "warning: could not read the latest version code" >&2
            LATEST=0
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          STAMP=$(date -u +%y%j%H%M | sed 's/^0*//')
          BUILD_NUMBER=$((LATEST + 1))
          if [ "$STAMP" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER=$STAMP; fi
          flutter --no-version-check build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GIT_SHA="${CM_COMMIT:-unknown}" \
            --split-debug-info=build/symbols
    artifacts:
      - apps/file_transfer/build/app/outputs/bundle/release/*.aab
      - apps/file_transfer/build/app/outputs/mapping/release/mapping.txt
      - apps/file_transfer/build/symbols/*.symbols
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # The first upload of a new app must be done manually in Play Console;
        # keep drafts until the store listing and Data safety form are complete.
        submit_as_draft: true

  # MSIX storage notes (packaged = has package identity):
  # * Writes below %LOCALAPPDATA% / %APPDATA% are virtualised into
  #   %LOCALAPPDATA%\Packages\<PFN>\LocalCache\{Local,Roaming}. That copy never
  #   roams and is deleted on uninstall. The app sees its logical paths; other
  #   processes (Explorer, handler apps) do not, so the native openFile and
  #   revealInFolder pass the shell the final path (GetFinalPathNameByHandleW).
  # * Downloads (Downloads\Ulash, visible received files) is NOT virtualised.
  # * A packaged install has no 1.0 Roaming data, so the Roaming → LocalAppData
  #   migration is skipped: the native localDataDirectory returns null under
  #   package identity (GetCurrentPackageFullName) and Dart keeps its
  #   application-support directory.
  windows-msix:
    name: Windows → MSIX package
    instance_type: windows_x2
    max_build_duration: 60
    environment:
      <<: *flutter_version
      # Optional signing for sideloading/Store: a secure group "windows_signing"
      # with WINDOWS_CERT_BASE64 (PFX, base64) and WINDOWS_CERT_PASSWORD.
      # Without it the package is built with msix's test certificate (only for
      # local testing; Microsoft Store re-signs packages it accepts).
    scripts:
      # PowerShell does not stop on a failing native command by itself.
      - name: Analyze and test
        script: |
          $ErrorActionPreference = "Stop"
          cd packages/transfer_core
          dart pub get --enforce-lockfile; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dart test; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cd ../../apps/file_transfer
          flutter --no-version-check pub get --enforce-lockfile; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter --no-version-check test --no-pub; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows
        script: |
          cd apps/file_transfer
          flutter --no-version-check build windows --release --no-pub --dart-define=GIT_SHA=$env:CM_COMMIT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package MSIX
        script: |
          $ErrorActionPreference = "Stop"
          cd apps/file_transfer
          if ($env:WINDOWS_CERT_BASE64) {
            $pfx = Join-Path $env:CM_BUILD_DIR "ulash_signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            dart run msix:create --build-windows false --certificate-path $pfx --certificate-password $env:WINDOWS_CERT_PASSWORD
            $code = $LASTEXITCODE
            Remove-Item $pfx
            if ($code) { exit $code }
          } else {
            dart run msix:create --build-windows false
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
    artifacts:
      - apps/file_transfer/build/windows/x64/runner/Release/*.msix

  asc-diagnostics:
    name: App Store Connect diagnostics (read-only)
    instance_type: linux_x2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: Certificates and profiles (metadata only)
        script: |
          set -euo pipefail
          app-store-connect certificates list --type DISTRIBUTION --json \
            | python3 -c 'import json,sys
          for c in json.load(sys.stdin):
              a = c.get("attributes", {})
              print(c.get("id"), a.get("certificateType"), a.get("displayName"), a.get("name"), a.get("platform"), "serial", a.get("serialNumber"), "expires", a.get("expirationDate"))'
          app-store-connect profiles list --json \
            | python3 -c 'import json,sys
          for p in json.load(sys.stdin):
              a = p.get("attributes", {})
              print(a.get("profileType"), a.get("profileState"), a.get("name"), "expires", a.get("expirationDate"))'

  testflight-testers:
    name: TestFlight internal testers
    instance_type: linux_x2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      vars:
        BUNDLE_ID: uz.ulash.app
        TESTFLIGHT_GROUP: Internal Testers
    scripts:
      - name: Internal group and account holder
        script: |
          set -euo pipefail
          python3 -m pip install --quiet "pyjwt[crypto]==2.10.1" requests
          python3 scripts/testflight_testers.py
