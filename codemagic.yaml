# Codemagic CI/CD for Ulash. Setup steps: docs/RELEASE.md.
#
# Before the first run (once, in the Codemagic UI):
#   1. Teams → Integrations → Developer Portal → add an App Store Connect API
#      key (role "App Manager") and name it exactly "Ulash App Store Connect"
#      (or change `integrations.app_store_connect` below).
#   2. App → Environment variables → group "ios_signing_key" with the secret
#      CERTIFICATE_PRIVATE_KEY (an RSA private key in PEM format; see
#      docs/RELEASE.md). Reusing one key prevents a new distribution
#      certificate from being created on every build.
#   3. Replace APP_STORE_APPLE_ID with the numeric "Apple ID" of the app
#      (App Store Connect → App Information).
#
# Both workflows start manually (no `triggering` section).

definitions:
  flutter_version: &flutter_version
    # Pinned to the version in the lockfiles. If Codemagic does not list this
    # version yet, use `stable` temporarily and re-run the analyzer and tests.
    flutter: 3.50.1
  core_tests: &core_tests
    name: Core — analyze and test
    script: |
      set -euo pipefail
      cd "$CM_BUILD_DIR/packages/transfer_core"
      dart pub get --enforce-lockfile
      dart analyze --fatal-infos
      dart test
  app_tests: &app_tests
    name: App — analyze and test
    script: |
      set -euo pipefail
      cd "$CM_BUILD_DIR/apps/file_transfer"
      flutter --no-version-check pub get --enforce-lockfile
      flutter --no-version-check analyze --no-pub
      flutter --no-version-check test --no-pub

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 75
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      <<: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - ulash_signing # CERTIFICATE_PRIVATE_KEY (kept for manual signing)
      vars:
        BUNDLE_ID: uz.ulash.app
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      # Full analysis and tests run on every push in GitHub Actions (Linux);
      # here the analyzer guards the exact commit being shipped.
      - name: Analyze
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/packages/transfer_core"
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos
          cd "$CM_BUILD_DIR/apps/file_transfer"
          flutter --no-version-check pub get --enforce-lockfile
          flutter --no-version-check analyze --no-pub
      - name: Find the App Store Connect app
        script: |
          set -euo pipefail
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")')
          if [ -z "$APP_ID" ]; then
            echo "No App Store Connect app for $BUNDLE_ID" >&2
            exit 1
          fi
          echo "App Store Connect app id: $APP_ID"
          echo "APP_STORE_APPLE_ID=$APP_ID" >> "$CM_ENV"
      # Signing: the archive is built unsigned; export re-signs it with an
      # Apple cloud-managed Distribution certificate through the integration's
      # API key. No development certificate, no private key, and none of the
      # account's limited Distribution certificates are needed.
      - name: Prepare signing
        script: |
          set -euo pipefail
          for v in APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!v:-}" ]; then echo "$v is not provided by the integration" >&2; exit 1; fi
          done
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          # Normalise whatever form the integration provides (raw PEM, escaped
          # newlines, @file:/@env: reference, or bare base64) into a PEM file.
          # Only the shape is printed, never the key.
          python3 - "$KEY_PATH" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip()
          if raw.startswith("@file:"):
              raw = open(os.path.expanduser(raw[6:])).read().strip()
          elif raw.startswith("@env:"):
              raw = os.environ[raw[5:]].strip()
          raw = raw.replace("\\r", "").replace("\\n", "\n").replace("\r", "")
          body = re.sub(r"-----[A-Z ]+-----", "", raw)
          body = re.sub(r"\s+", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          print(f"key shape: {len(raw)} chars, header={'BEGIN' in raw}, body={len(body)} base64 chars")
          with open(sys.argv[1], "w") as handle:
              handle.write(pem)
          PY
          chmod 600 "$KEY_PATH"
          TEAM_ID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json \
            | python3 -c 'import json,sys; a=json.load(sys.stdin)[0].get("attributes",{}); print(a.get("seedId") or a.get("seed_id") or "")')
          if [ -z "$TEAM_ID" ]; then echo "Could not determine the team ID" >&2; exit 1; fi
          echo "Team ID: $TEAM_ID"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$CM_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$CM_ENV"
      - name: Build IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/file_transfer"
          # Marketing version comes from pubspec.yaml (version: X.Y.Z+N).
          BUILD_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          # The first upload has no builds yet; any API error is printed.
          if ! LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID"); then
            echo "No previous build number found; using a timestamp." >&2
            LATEST=0
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          # A UTC timestamp floor (yyDDDHHMM) keeps numbers increasing even if
          # the lookup failed, so an upload can never be a duplicate.
          STAMP=$(date -u +%y%j%H%M | sed 's/^0*//')
          BUILD_NUMBER=$((LATEST + 1))
          if [ "$STAMP" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER=$STAMP; fi
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          flutter --no-version-check build ios --release --config-only --no-codesign --no-pub \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p "$CM_BUILD_DIR/build" /tmp/xcodebuild_logs
          cd ios
          AUTH=(-allowProvisioningUpdates
            -authenticationKeyPath "$ASC_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          xcodebuild archive \
            -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > /tmp/xcodebuild_logs/archive.log 2>&1 || {
              grep -E 'error:|error -|Code Signing|No profiles|provision|certificate' /tmp/xcodebuild_logs/archive.log | sort -u | head -60
              echo "----- tail -----"; tail -80 /tmp/xcodebuild_logs/archive.log
              exit 1
            }
          tail -5 /tmp/xcodebuild_logs/archive.log
          cat > "$CM_BUILD_DIR/build/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Runner.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            "${AUTH[@]}" > /tmp/xcodebuild_logs/export.log 2>&1 || {
              grep -E 'error|Error' /tmp/xcodebuild_logs/export.log | sort -u | head -40
              tail -60 /tmp/xcodebuild_logs/export.log
              exit 1
            }
          tail -5 /tmp/xcodebuild_logs/export.log
          ls -la "$CM_BUILD_DIR/build/ipa"
      - name: Remove API key
        script: rm -rf "$HOME/private_keys"
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/Runner.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: the build appears in TestFlight for INTERNAL testers
        # after Apple finishes processing (no Beta App Review needed).
        # For external testers, fill in "Test Information" in App Store
        # Connect first, then set submit_to_testflight: true and list groups.
        submit_to_testflight: false
        # beta_groups:
        #   - External testers
        submit_to_app_store: false

  android-internal:
    name: Android → Google Play (internal)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      <<: *flutter_version
      # Upload keystore added in Codemagic → Code signing identities → Android
      # keystores. Codemagic exports CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD,
      # CM_KEY_ALIAS and CM_KEY_PASSWORD, which android/app/build.gradle.kts reads.
      android_signing:
        - ulash_upload_keystore
      groups:
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (service account JSON)
      vars:
        PACKAGE_NAME: uz.ulash.app
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - *core_tests
      - *app_tests
      - name: Build App Bundle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/file_transfer"
          BUILD_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          if ! LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME"); then
            echo "warning: could not read the latest version code" >&2
            LATEST=0
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          STAMP=$(date -u +%y%j%H%M | sed 's/^0*//')
          BUILD_NUMBER=$((LATEST + 1))
          if [ "$STAMP" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER=$STAMP; fi
          flutter --no-version-check build appbundle --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"
    artifacts:
      - apps/file_transfer/build/app/outputs/bundle/release/*.aab
      - apps/file_transfer/build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # The first upload of a new app must be done manually in Play Console;
        # keep drafts until the store listing and Data safety form are complete.
        submit_as_draft: true

  asc-diagnostics:
    name: App Store Connect diagnostics (read-only)
    instance_type: linux_x2
    max_build_duration: 10
    integrations:
      app_store_connect: monetniy-mir-asc
    scripts:
      - name: Certificates and profiles (metadata only)
        script: |
          set -euo pipefail
          app-store-connect certificates list --type DISTRIBUTION --json \
            | python3 -c 'import json,sys
          for c in json.load(sys.stdin):
              a = c.get("attributes", {})
              print(c.get("id"), a.get("certificateType"), a.get("displayName"), a.get("name"), a.get("platform"), "serial", a.get("serialNumber"), "expires", a.get("expirationDate"))'
          app-store-connect profiles list --json \
            | python3 -c 'import json,sys
          for p in json.load(sys.stdin):
              a = p.get("attributes", {})
              print(a.get("profileType"), a.get("profileState"), a.get("name"), "expires", a.get("expirationDate"))'
