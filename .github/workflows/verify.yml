name: Verify source

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: Also compile an unsigned-for-production debug Android APK
        type: boolean
        required: false
        default: false
      build_ios:
        description: Also compile iOS without device signing (macOS required)
        type: boolean
        required: false
        default: false
      build_windows:
        description: Also compile an unsigned Windows x64 release bundle
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # A push supersedes an earlier push to the same ref, but never cancels a
  # manually dispatched native build.
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Analyze and test
        run: python3 scripts/verify.py

  # Paths, "disk full" codes and file locking differ on Windows.
  verify_windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: python scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Analyze and test
        run: python scripts/verify.py

  android_debug:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Resolve dependencies
        working-directory: apps/file_transfer
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Compile debug Android
        run: python3 scripts/build_android.py --no-pub --target-platform android-arm64 --split-per-abi

  # These jobs prepare native compilation gates. They have not been executed
  # in the Linux development workspace, and are not physical-device acceptance.
  ios_unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Inspect Xcode toolchain
        run: xcodebuild -version
      - name: Resolve locked dependencies
        working-directory: apps/file_transfer
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Compile iOS without signing
        working-directory: apps/file_transfer
        run: flutter --no-version-check build ios --release --no-codesign --no-pub

  windows_unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: python scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Resolve locked dependencies
        working-directory: apps/file_transfer
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Compile Windows x64 bundle
        working-directory: apps/file_transfer
        run: flutter --no-version-check build windows --release --no-pub
