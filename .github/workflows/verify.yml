name: Verify source

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: Also compile an unsigned-for-production debug Android APK
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Analyze and test
        run: python3 scripts/verify.py

  android_debug:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Resolve dependencies
        working-directory: apps/file_transfer
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Compile debug Android
        run: python3 scripts/build_android.py --no-pub --target-platform android-arm64 --split-per-abi
