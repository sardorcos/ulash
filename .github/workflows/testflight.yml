name: iOS → TestFlight

# Builds a signed release IPA on a macOS runner and uploads it to App Store
# Connect (TestFlight). Signing is cloud-managed by Apple through an
# App Store Connect API key: no certificate or profile is stored anywhere.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       App Store Connect API key ID          (e.g. 2X9R4HXF34)
#   ASC_ISSUER_ID    Issuer ID shown above the keys table  (UUID)
#   ASC_PRIVATE_KEY  full contents of AuthKey_<KEY_ID>.p8, including the
#                    BEGIN/END lines
# The API key needs the "Admin" role (cloud signing creates certificates).
#
# Modes:
#   upload  — check the key and app record (Linux), then build, sign and
#             upload from macOS. The default.
#   check   — only the Linux preflight: secrets, key, bundle ID, team, app.
#             Cheap; no macOS minutes.
#   dry_run — macOS archive without signing or secrets, to validate the
#             build pipeline itself.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: upload | check | dry_run
        type: choice
        options: [upload, check, dry_run]
        default: upload

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true
  BUNDLE_ID: uz.ulash.app

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"
      - name: Analyze and test
        run: python3 scripts/verify.py

  preflight:
    if: inputs.mode != 'dry_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      team_id: ${{ steps.lookup.outputs.team_id }}
      app_id: ${{ steps.lookup.outputs.app_id }}
      build_number: ${{ steps.number.outputs.build_number }}
      build_name: ${{ steps.number.outputs.build_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          if [ "$missing" = 0 ] && ! printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::ASC_PRIVATE_KEY must be the whole .p8 file including the BEGIN/END PRIVATE KEY lines"
            missing=1
          fi
          exit $missing

      - name: Install App Store Connect tooling
        run: python3 -m pip install --quiet codemagic-cli-tools==0.71.0

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Bundle ID, team and app record
        id: lookup
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ids=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json)
          if [ "$(echo "$ids" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = "0" ]; then
            echo "Registering $BUNDLE_ID"
            ids="[$(app-store-connect bundle-ids create "$BUNDLE_ID" --name Ulash --platform IOS --json)]"
          fi
          team=$(echo "$ids" | python3 -c 'import json,sys; a=json.load(sys.stdin)[0].get("attributes",{}); print(a.get("seedId") or a.get("seed_id") or "")')
          if [ -z "$team" ]; then echo "::error::Could not determine the team ID from the bundle ID"; exit 1; fi
          echo "Team ID: $team"
          apps=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json)
          app_id=$(echo "$apps" | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")')
          if [ -z "$app_id" ]; then
            echo "::error::No App Store Connect app record for $BUNDLE_ID. Create app \"Ulash\" (bundle ID $BUNDLE_ID) in App Store Connect → Apps → New App."
            exit 1
          fi
          echo "App Store Connect app id: $app_id"
          echo "team_id=$team" >> "$GITHUB_OUTPUT"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Choose build number
        id: number
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_ID: ${{ steps.lookup.outputs.app_id }}
        run: |
          set -uo pipefail
          # An app without any build yet has no number: that is expected.
          if ! latest=$(app-store-connect get-latest-build-number "$APP_ID"); then
            echo "No previous build number found; starting from a timestamp."
            latest=0
          fi
          case "$latest" in ''|*[!0-9]*) latest=0 ;; esac
          stamp=$(date -u +%y%j%H%M | sed 's/^0*//')
          build=$((latest + 1))
          if [ "$stamp" -gt "$build" ]; then build=$stamp; fi
          name=$(grep -E '^version:' apps/file_transfer/pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          echo "Version $name ($build)"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "build_name=$name" >> "$GITHUB_OUTPUT"

      - name: Remove API key
        if: always()
        run: rm -rf "$HOME/private_keys"

  build:
    needs: [tests, preflight]
    if: >-
      always() &&
      needs.tests.result == 'success' &&
      (inputs.mode == 'dry_run' ||
       (inputs.mode == 'upload' && needs.preflight.result == 'success'))
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      DRY_RUN: ${{ inputs.mode == 'dry_run' }}
      TEAM_ID: ${{ needs.preflight.outputs.team_id }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build_number || '1' }}
      BUILD_NAME: ${{ needs.preflight.outputs.build_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Select newest stable Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Install verified Flutter SDK
        run: python3 scripts/install_flutter_ci.py --destination "${{ runner.temp }}/transfer-sdk"

      - name: Resolve locked dependencies
        working-directory: apps/file_transfer
        run: flutter --no-version-check pub get --enforce-lockfile

      - name: Prepare iOS project
        working-directory: apps/file_transfer
        run: |
          echo "Version $BUILD_NAME ($BUILD_NUMBER)"
          flutter --no-version-check build ios --release --config-only --no-pub \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Write API key
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: apps/file_transfer/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then
            signing=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          else
            signing=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
              DEVELOPMENT_TEAM="$TEAM_ID"
              CODE_SIGN_STYLE=Automatic
            )
          fi
          status=0
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            "${signing[@]}" > "$RUNNER_TEMP/archive.log" 2>&1 || status=$?
          grep -E 'error:|\*\* ARCHIVE' "$RUNNER_TEMP/archive.log" | tail -40 || true
          if [ "$status" != 0 ] || [ ! -d "$RUNNER_TEMP/Runner.xcarchive" ]; then
            tail -150 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties' "$RUNNER_TEMP/Runner.xcarchive/Info.plist"

      - name: Export and upload to App Store Connect
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || status=$?
          tail -80 "$RUNNER_TEMP/export.log"
          if [ "$status" != 0 ] || ! grep -qE 'EXPORT SUCCEEDED|Upload succeeded|Uploaded' "$RUNNER_TEMP/export.log"; then
            exit 1
          fi
          echo "::notice::Uploaded Ulash $BUILD_NAME ($BUILD_NUMBER). It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove API key
        if: always()
        run: rm -rf "$HOME/private_keys"
